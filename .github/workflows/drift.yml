# A test, here only until its result is read: does the loop hold its look, refill on refill? Eighteen refills in a row, each out
# of the last, with 0, 4 or 8 of the eight taste frames from the banked water. Small batches (one dream, eight frames), so it is
# a harsher loop than the real one. Publishes nothing.
name: drift test
on:
  pull_request:
    paths: ['.github/workflows/drift.yml']
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        anchor: [0, 4, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: kat-titter/vanitas-veritas
          ref: ${{ vars.REFILL_SOURCE_REF || 'main' }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/code/refill.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: refill-sd15-fp16-lcm-1
      - run: |
          pip install -q -r src/code/refill.txt
          cp -r site/reservoir banked
          python src/code/refill.py --from site/reservoir --banked banked --anchor ${{ matrix.anchor }} --out sim --days 18 --dreams 1 --per 2 --passages 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-anchor${{ matrix.anchor }}
          path: |
            sim_drift.jpg
            sim_drift.jsonl
            sim/day18
          retention-days: 14
